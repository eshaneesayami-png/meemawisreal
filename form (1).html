<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registration form</title>
</head>
<body bgcolor= "#97EFDF">
<body>
<form method="post" action="submit.html">
	<fieldset color="black">
		<legend> Student Registration Form </legend><br>
		<label for="name"> Name: </label>
		<input type= "text" id="name" name="" placeholder="Enter a name"><br><br>

		<label for="address"> Address: </label>
		<input type= "text" id="address" address="" placeholder="Enter a address"><br><br>

		<label for="phone no."> Phone no: </label>
		<input type= "tel" id="phone no." phone  no.="" placeholder="Enter a Phone no"><br><br>

		<label for="email"> Email: </label>
		<input type= "email" id="email" email="" placeholder="Enter your email"><br><br>

        <label for="gpa"> SEE GPA: </label>
		<input type= "floating number" id="gpa" gpa=""><br><br>

		<label for="faculty"> Faculty: </label>
		<select name="faculty">
		<option value="science">Science</option>
		<option value="management">Management</option>
		<option value="arts">Arts</option></select><br><br>

		<label for="gender"> Gender: </label>
		<input type= "radio" gender="" value="male">Male
		<input type= "radio" gender="" value="female">Female
		<input type= "radio" gender="" value="others">Others <br><br>

		<label for="language"> Language: </label>
		<input type= "checkbox" language="" value="Nepali">Nepali
		<input type= "checkbox" language="" value="English">English
		<input type= "checkbox" language="" value="British">British<br><br>

		<label for= "image"> Image: </label>
		<input type="file" id="image" name="image"><br><br>

		<label for="aboutyourself">Write about yourself</label><br>
		<textarea name="about yourself" rows="3" cols="40" placeholder="Write in 150 words"></textarea><br><br>

		<input type="submit" value="Submit"><br><br>
		<input type="reset" name= "Reset">

	</fieldset>
</form>
</body>
</html>
